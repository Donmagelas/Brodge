name: Brodge checks
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: npm install --prefix web --ignore-scripts
      - run: npm run build --prefix web
      - run: go test ./...
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build -o Brodge ./cmd/brodge
      # This disposable runner has no person to confirm user-domain trust.
      - run: sudo env "BRODGE_SIGNING_DIR=$RUNNER_TEMP/brodge-signing" BRODGE_SIGNING_TRUST_DOMAIN=admin ./scripts/sign-macos.sh --setup
        timeout-minutes: 3
      - run: sudo env "BRODGE_SIGNING_DIR=$RUNNER_TEMP/brodge-signing" ./scripts/package-macos.sh
      - run: sudo codesign --verify --deep --strict build/Brodge.app
