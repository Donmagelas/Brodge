name: Brodge checks
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: npm install --prefix web --ignore-scripts
      - run: npm run build --prefix web
      - run: go test ./...
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build -o Brodge ./cmd/brodge
      - run: ./scripts/sign-macos.sh --setup
      - run: ./scripts/package-macos.sh
      - run: codesign --verify --deep --strict build/Brodge.app
