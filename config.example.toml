# Local Feishu → existing Codex Desktop conversation bridge.
# Copy to config.toml (private; never commit credentials).
data_dir = ".state"
language = "zh"

[management]
enabled = true
port = 18789
token = "${DESKTOP_BRIDGE_ADMIN_TOKEN}"

[[projects]]
name = "desktop"
[projects.agent]
type = "codex-desktop"
[projects.agent.options]
protocol = "local-v11-start-v2"
allowed_threads = ["REPLACE_WITH_AUTHORIZED_DESKTOP_THREAD_ID"]
native_answers = false
# socket = "/Users/your-user/.codex/ipc/ipc.sock"

# Omit platforms while using Web to create and pair an application.
# Activate forwarding with local credentials and the verified creator identity.
[[projects.platforms]]
type = "feishu"
[projects.platforms.options]
app_id = "REPLACE_WITH_FEISHU_APP_ID"
app_secret = "${DESKTOP_BRIDGE_FEISHU_SECRET}"
tenant_key = "REPLACE_WITH_TENANT_KEY"
allow_from = "REPLACE_WITH_OWNER_OPEN_ID"
